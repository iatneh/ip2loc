apiVersion: v1
kind: Namespace
metadata:
  name: hsia

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: hsia
  labels:
    app: ip2loc
  name: ip2loc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ip2loc
  template:
    metadata:
      labels:
        app: ip2loc
    spec:
      containers:
        - name: ip2loc
          image: iatneh1900/ip2loc
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Readiness probe: /readyz only returns 200 once the city mmdb is
          # loaded into memory, so a pod is not sent traffic before it can
          # actually answer queries.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          # All knobs are env variables — there is no config file. Uncomment
          # and set to enable scheduled updates from a private mirror.
          env:
            - name: TZ
              value: "Asia/Shanghai"
            # - name: IP2LOC_UPDATER_ENABLED
            #   value: "true"
            # - name: IP2LOC_UPDATER_CRON
            #   value: "0 0 */2 * * *"
            # - name: IP2LOC_UPDATER_CITY_URL
            #   value: "https://raw.incept.pw/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb"
            # - name: IP2LOC_UPDATER_ASN_URL
            #   value: "https://example.com/GeoLite2-ASN.mmdb"
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          emptyDir: {}
          # For stateful mmdb caching across pod restarts, swap to a PVC:
          # persistentVolumeClaim:
          #   claimName: ip2loc-data
          resources:
            limits:
              cpu: 30m
            requests:
              cpu: 10m


---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: ip2loc
  namespace: hsia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ip2loc
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50


---
apiVersion: v1
kind: Service
metadata:
  namespace: hsia
  name: ip2loc
spec:
  # type: NodePort
  selector:
    app: ip2loc
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: hsia
  name: ip2loc
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ip(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ip2loc
                port:
                  number: 80
