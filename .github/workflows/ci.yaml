name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    name: build linux/amd64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.9"
          cache: true
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: ip2loc-linux-amd64
          path: build/ip2loc

  # Build and push the container image to Docker Hub on every push to master.
  # Uses Actions secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
  # Tags: <username>/ip2loc:sha-<short-sha>, plus :latest on the master branch.
  #
  # Freshness: the prefetch step below downloads the latest mmdb files
  # into ./db-cache/ on every CI run; the Dockerfile then COPYs them into
  # /opt/data. Each push therefore ships an image with up-to-date GeoLite2
  # data — first container start has data ready, no download wait.
  docker:
    name: build & push docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Prefetch the latest mmdb files. The Dockerfile does a plain
      # `COPY db-cache/ /opt/data/` — no network at build time — so the
      # freshness guarantee lives entirely here.
      #
      # A download failure is non-fatal: we log and continue so a flaky
      # mirror never blocks the image push. The image then ships with the
      # baked-in copy from the previous successful run (BuildKit cache),
      # and the in-container updater will catch up on first start.
      - name: Prefetch latest mmdb files
        env:
          CITY_URL: ${{ vars.CITY_MMDB_URL || 'https://git.io/GeoLite2-City.mmdb' }}
          ASN_URL:  ${{ vars.ASN_MMDB_URL  || 'https://git.io/GeoLite2-ASN.mmdb' }}
        run: |
          set -eux
          mkdir -p db-cache
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
               --max-time 180 -o db-cache/GeoLite2-City.mmdb "$CITY_URL" \
            || { echo "WARN: city mmdb download failed, falling back to last cached copy"; exit 0; }
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
               --max-time 180 -o db-cache/GeoLite2-ASN.mmdb  "$ASN_URL" \
            || { echo "WARN: asn mmdb download failed, falling back to last cached copy"; exit 0; }
          ls -lh db-cache

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ip2loc
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
