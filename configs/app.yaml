# ip2loc default configuration.
# All values can be overridden via env: IP2LOC_<SECTION>_<KEY>
# e.g. IP2LOC_HTTP_PORT=9090, IP2LOC_LOG_LEVEL=debug.

http:
  address: 0.0.0.0
  port: 8080
  read-timeout: 10s
  write-timeout: 10s
  idle-timeout: 60s

log:
  level: info        # debug | info | warn | error
  format: text       # text | json
  output: stdout     # comma-separated: stdout, stderr, or a file path

geoip:
  db-dir: ./data
  city-filename: GeoLite2-City.mmdb
  asn-filename: GeoLite2-ASN.mmdb
  default-lang: en

updater:
  enabled: false
  cron: "0 0 */2 * * *"          # every 2 hours
  download-timeout: 120s
  city-url: ""                    # set me to enable scheduled city downloads
  asn-url: ""
  headers: []                     # "Authorization: Bearer xxx"

defaults:
  allow-private-ip: true
